# DoubleStar.Frontend/.github/workflows/frontend.yml
name: Frontend CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx nx test shared
      - run: npx nx build doublestar-staff
      - run: npx nx build doublestar-customer
      - run: npx nx build doublestar-marketing