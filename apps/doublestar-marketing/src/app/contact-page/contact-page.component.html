<!-- apps/doublestar-marketing/src/app/contact-page/contact-page.component.html -->
<div class="page">
  <h1 class="page-title">Visit or Contact Us</h1>
  <div class="contact-grid">
    <section class="contact-card">
      <div class="contact-icon"><app-icon name="map-pin" [size]="22" /></div>
      <h2 class="contact-heading">Store address</h2>
      <address class="contact-text">REPLACE-WITH-YOUR-REAL-STREET-ADDRESS, Lagos, Nigeria</address>
    </section>
    <section class="contact-card">
      <div class="contact-icon"><app-icon name="phone-call" [size]="22" /></div>
      <h2 class="contact-heading">Phone</h2>
      <p class="contact-text"><a href="tel:REPLACE-WITH-YOUR-REAL-PHONE-NUMBER" class="contact-link">REPLACE-WITH-YOUR-REAL-PHONE-NUMBER</a></p>
    </section>
    <section class="contact-card">
      <div class="contact-icon"><app-icon name="mail" [size]="22" /></div>
      <h2 class="contact-heading">Email</h2>
      <p class="contact-text"><a href="mailto:REPLACE-WITH-YOUR-REAL-EMAIL" class="contact-link">REPLACE-WITH-YOUR-REAL-EMAIL</a></p>
    </section>
    <section class="contact-card">
      <div class="contact-icon"><app-icon name="clock" [size]="22" /></div>
      <h2 class="contact-heading">Opening hours</h2>
      <p class="contact-text">Monday – Saturday: REPLACE-WITH-YOUR-REAL-HOURS</p>
      <p class="contact-text">Sunday: REPLACE-WITH-YOUR-REAL-HOURS</p>
    </section>
  </div>
</div>
