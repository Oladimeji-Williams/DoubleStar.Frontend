<!-- apps/doublestar-marketing/src/app/faq-page/faq-page.component.html -->
<div class="page">
  <h1 class="page-title">Frequently Asked Questions</h1>
  <div class="faq-list">
    @for (faq of faqs; track faq.question; let i = $index) {
      <article class="faq-item" [class.faq-item-open]="openIndex() === i">
        <button
          type="button"
          class="faq-question"
          [attr.aria-expanded]="openIndex() === i"
          (click)="toggle(i)"
        >
          <span>{{ faq.question }}</span>
          <app-icon name="chevron-down" [size]="18" class="faq-chevron" />
        </button>
        <p class="faq-answer">{{ faq.answer }}</p>
      </article>
    }
  </div>
</div>
