<!-- apps/doublestar-marketing/src/app/marketing-layout/marketing-layout.component.html -->
<div class="site">
  <header class="topbar">
    <a routerLink="/" class="brand"><app-brand-logo [size]="26" /> <app-brand-wordmark /></a>
    <nav class="nav" aria-label="Main">
      <a routerLink="/" routerLinkActive="nav-link-active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link">Home</a>
      <a routerLink="/services" routerLinkActive="nav-link-active" class="nav-link">Services</a>
      <a routerLink="/faq" routerLinkActive="nav-link-active" class="nav-link">FAQ</a>
      <a routerLink="/contact" routerLinkActive="nav-link-active" class="nav-link">Contact</a>
    </nav>
    <a [href]="customerAppUrl + '/login'" class="cta-link">Sign in</a>
  </header>

  <main class="content">
    <router-outlet />
  </main>

  <footer class="footer">
    <div class="footer-grid">
      <div>
        <p class="footer-brand"><app-brand-wordmark /></p>
        <p class="footer-text">Phone &amp; electronic gadget sales and repairs.</p>
      </div>
      <div>
        <h2 class="footer-heading">Contact</h2>
        <p class="footer-text">REPLACE-WITH-YOUR-REAL-ADDRESS</p>
        <p class="footer-text">REPLACE-WITH-YOUR-REAL-PHONE-NUMBER</p>
        <p class="footer-text">REPLACE-WITH-YOUR-REAL-EMAIL</p>
      </div>
      <div>
        <h2 class="footer-heading">Account</h2>
        <a [href]="customerAppUrl + '/register'" class="footer-link">Create an account</a>
        <a [href]="customerAppUrl + '/login'" class="footer-link">Sign in</a>
        <a [href]="customerAppUrl + '/products'" class="footer-link">Browse products</a>
      </div>
    </div>
    <p class="copyright">&copy; {{ currentYear }} Double Star. All rights reserved.</p>
  </footer>
</div>
