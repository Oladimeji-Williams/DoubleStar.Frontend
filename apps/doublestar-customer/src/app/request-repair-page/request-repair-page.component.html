<!-- apps/doublestar-customer/src/app/request-repair-page/request-repair-page.component.html -->
<div class="page">
  <h1 class="page-title">Request a repair</h1>
  <p class="subtitle">Tell us what's wrong — our technicians will diagnose it and send you a quote.</p>

  <div class="card">
    <div class="field">
      <label class="label" for="device-description">Device</label>
      <input id="device-description" [ngModel]="deviceDescription()" (ngModelChange)="deviceDescription.set($event)" placeholder="e.g. iPhone 12, cracked screen" class="input" />
    </div>
    <div class="field">
      <label class="label" for="imei-or-serial">IMEI / serial (optional)</label>
      <input id="imei-or-serial" [ngModel]="imeiOrSerial()" (ngModelChange)="imeiOrSerial.set($event)" class="input" />
    </div>
    <div class="field">
      <label class="label" for="fault-description">What's wrong?</label>
      <textarea id="fault-description" [ngModel]="faultDescription()" (ngModelChange)="faultDescription.set($event)" rows="4" class="input"></textarea>
    </div>

    @if (errorMessage()) { <p class="error">{{ errorMessage() }}</p> }

    <button (click)="submit()" [disabled]="isBusy() || !canSubmit()" class="primary-button">
      {{ isBusy() ? 'Submitting...' : 'Submit request' }}
    </button>
  </div>
</div>
