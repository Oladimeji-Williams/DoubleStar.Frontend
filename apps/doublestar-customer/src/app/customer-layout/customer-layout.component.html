<!-- apps/doublestar-customer/src/app/customer-layout/customer-layout.component.html -->
<div class="layout">
  <header class="topbar">
    <span class="brand">Double Star</span>
    <nav class="nav">
      <a routerLink="/my/sales" routerLinkActive="nav-link-active" class="nav-link">My orders</a>
      <a routerLink="/my/repairs" routerLinkActive="nav-link-active" class="nav-link">My repairs</a>
    </nav>
    <div class="user-panel">
      <span class="user-name">{{ currentUserStore.currentUser()?.displayName }}</span>
      <button (click)="logout()" class="logout-button">Sign out</button>
    </div>
  </header>

  <main class="content">
    <router-outlet />
  </main>
</div>
