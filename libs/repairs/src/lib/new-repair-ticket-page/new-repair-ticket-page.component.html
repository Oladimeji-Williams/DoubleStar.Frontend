<!-- libs/repairs/src/lib/new-repair-ticket-page/new-repair-ticket-page.component.html -->
<div class="page">
  <h1 class="page-title">New repair ticket</h1>

  <div class="card">
    <app-customer-selector (selectionChange)="customer.set($event)" />

    <div class="field">
      <label for="new-repair-ticket-page-device" class="label">Device</label>
      <input id="new-repair-ticket-page-device"
        [ngModel]="deviceDescription()"
        (ngModelChange)="deviceDescription.set($event)"
        placeholder="e.g. iPhone 12, cracked screen"
        class="input"
      />
    </div>

    <div class="field">
      <label for="new-repair-ticket-page-imei-serial" class="label">IMEI / serial (optional)</label>
      <input id="new-repair-ticket-page-imei-serial" [ngModel]="imeiOrSerial()" (ngModelChange)="imeiOrSerial.set($event)" class="input" />
    </div>

    <div class="field">
      <label for="new-repair-ticket-page-fault-description" class="label">Fault description</label>
      <textarea id="new-repair-ticket-page-fault-description"
        [ngModel]="faultDescription()"
        (ngModelChange)="faultDescription.set($event)"
        rows="3"
        class="input"
      ></textarea>
    </div>

    @if (errorMessage()) {
      <p class="error">{{ errorMessage() }}</p>
    }

    <button (click)="submit()" [disabled]="isBusy() || !canSubmit()" class="primary-button">
      {{ isBusy() ? 'Creating...' : 'Create ticket' }}
    </button>
  </div>
</div>
