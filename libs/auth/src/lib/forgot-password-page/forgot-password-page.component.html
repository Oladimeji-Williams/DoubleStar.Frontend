<div class="auth-page">
  <div class="hero">
    <app-auth-marketing-panel
      heading="Reset your password"
      subtitle="Enter your email and we'll send you a secure link to create a new password."
    />
  </div>

  <div
    class="card"
    [attr.data-position]="cardPosition"
  >
    <app-brand-wordmark size="sm" />

    @if (!sent()) {
      <h2 class="card-title">
        Forgot your password?
      </h2>

      <div class="field">
        <app-icon
          name="mail"
          [size]="16"
          class="field-icon"
        />

        <input
          type="email"
          placeholder="Email"
          autocomplete="email"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          class="input"
        />
      </div>

      <app-turnstile-widget
        (verified)="turnstileToken.set($event)"
      />

      @if (errorMessage()) {
        <p class="error">
          {{ errorMessage() }}
        </p>
      }

      <button
        type="button"
        (click)="submit()"
        [disabled]="isSubmitting() || !canSubmit()"
        class="submit-button"
      >
        {{
          isSubmitting()
            ? 'Sending...'
            : 'Send reset link'
        }}
      </button>

      <a
        routerLink="/login"
        class="toggle-link"
      >
        Back to sign in
      </a>
    } @else {
      <h2 class="card-title">
        Check your email
      </h2>

      <p class="hint">
        If an account exists for that email, we've sent
        instructions to reset your password.
      </p>

      <a
        routerLink="/login"
        class="toggle-link"
      >
        Back to sign in
      </a>
    }
  </div>
</div>
