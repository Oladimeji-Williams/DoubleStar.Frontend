<!-- libs/auth/src/lib/register-page/register-page.component.html — full replacement -->
<div class="auth-page">
  <div class="hero"><app-auth-marketing-panel heading="Join Double Star" subtitle="Create a free account to request repairs, track their status, and shop phones & accessories online." /></div>

  <div class="card" [attr.data-position]="cardPosition">
    <app-brand-wordmark size="sm" />
    <h2 class="card-title">Create an account</h2>

    <div class="field">
      <app-icon name="mail" [size]="16" class="field-icon" />
      <input type="email" placeholder="Email" [ngModel]="email()" (ngModelChange)="email.set($event)" class="input" />
    </div>
    <div class="field">
      <app-icon name="lock" [size]="16" class="field-icon" />
      <input type="password" placeholder="Password (12+ characters)" [ngModel]="password()" (ngModelChange)="password.set($event)" class="input" />
    </div>
    <app-turnstile-widget
      (verified)="turnstileToken.set($event)"
    />

    @if (errorMessage()) { <p class="error">{{ errorMessage() }}</p> }
    <button (click)="submit()" [disabled]="isSubmitting() || !canSubmit()" class="submit-button">{{ isSubmitting() ? 'Creating account...' : 'Create account' }}</button>
    <p class="footer-text">Already have an account? <a routerLink="/login" class="footer-link">Sign in</a></p>
    <p class="hint">You can add your name and other details after signing in.</p>
  </div>
</div>
