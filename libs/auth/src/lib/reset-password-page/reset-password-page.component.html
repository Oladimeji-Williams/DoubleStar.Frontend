<!-- apps/doublestar-customer/src/app/reset-password-page/reset-password-page.component.html -->
<div class="page" style="max-width:24rem;margin:4rem auto;padding:0 1.5rem;">
  <h1>Choose a new password</h1>
  <input type="password" [ngModel]="newPassword()" (ngModelChange)="newPassword.set($event)" placeholder="New password" style="width:100%;padding:0.5rem;margin:1rem 0;" />
  @if (errorMessage()) { <p>{{ errorMessage() }}</p> }
  <button (click)="submit()">Reset password</button>
</div>
