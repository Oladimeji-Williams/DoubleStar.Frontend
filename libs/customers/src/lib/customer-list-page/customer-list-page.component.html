<div class="page">

  <div class="page-header">

    <h1 class="page-title">
      Customers
    </h1>

    <a
      routerLink="/customers/new"
      class="primary-button">
      New customer
    </a>

  </div>


  <div class="customer-search">

    <input
      type="search"
      class="customer-search-input"
      placeholder="Search name, phone or email..."
      [ngModel]="searchTerm()"
      (ngModelChange)="
        onSearch($event)
      " />

  </div>


  @if (errorMessage()) {

    <p class="error">

      {{ errorMessage() }}

      <button
        type="button"
        class="retry-link"
        (click)="retryLoad()">

        Try again

      </button>

    </p>

  }


  <app-data-table
    [columns]="columns"
    [rows]="customers()"
    [totalCount]="totalCount()"
    [page]="page()"
    [pageSize]="pageSize()"
    [sortBy]="sortBy()"
    [sortDirection]="sortDirection()"
    [filters]="filters()"
    [rowLink]="rowLink"
    [loading]="isLoading()"
    emptyMessage="No customers found."
    (queryChange)="
      onTableQuery($event)
    " />

</div>
