<!-- libs/customers/src/lib/new-customer-page/new-customer-page.component.html -->
<div class="page">
  <h1 class="page-title">New customer</h1>

  <div class="card">
    <div class="field">
      <label for="new-customer-page-name" class="label">Name</label>
      <input id="new-customer-page-name" [ngModel]="name()" (ngModelChange)="name.set($event)" class="input" />
    </div>

    <div class="field">
      <label for="new-customer-page-phone" class="label">Phone (optional)</label>
      <input id="new-customer-page-phone" [ngModel]="phone()" (ngModelChange)="phone.set($event)" class="input" />
    </div>

    <div class="field">
      <label for="new-customer-page-email" class="label">Email (optional)</label>
      <input id="new-customer-page-email" type="email" [ngModel]="email()" (ngModelChange)="email.set($event)" class="input" />
    </div>

    @if (errorMessage()) {
      <p class="error">{{ errorMessage() }}</p>
    }

    <button (click)="submit()" [disabled]="isBusy() || !name().trim()" class="primary-button">
      {{ isBusy() ? 'Creating...' : 'Create customer' }}
    </button>
  </div>
</div>
