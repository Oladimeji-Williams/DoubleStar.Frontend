<!-- libs/customers/src/lib/customer-detail-page/customer-detail-page.component.html -->
<div class="page">
  @if (isLoading()) {
    <p>Loading...</p>
  } @else if (customer(); as c) {
    <h1 class="page-title">{{ c.name }}</h1>
    <p class="subtitle">{{ c.hasAccount ? 'Has an online account' : 'Walk-in customer' }}</p>

    <div class="card">
      <div class="field">
        <label for="customer-detail-page-name" class="label">Name</label>
        <input id="customer-detail-page-name" [ngModel]="name()" (ngModelChange)="name.set($event)" class="input" />
      </div>

      <div class="field">
        <label for="customer-detail-page-phone" class="label">Phone</label>
        <input id="customer-detail-page-phone" [ngModel]="phone()" (ngModelChange)="phone.set($event)" class="input" />
      </div>

      <div class="field">
        <label for="customer-detail-page-email" class="label">Email</label>
        <input id="customer-detail-page-email" type="email" [ngModel]="email()" (ngModelChange)="email.set($event)" class="input" />
      </div>

      <div class="field">
        <label for="customer-detail-page-address" class="label">Address</label>
        <input id="customer-detail-page-address" [ngModel]="address()" (ngModelChange)="address.set($event)" class="input" />
      </div>

      @if (errorMessage()) {
        <p class="error">{{ errorMessage() }}</p>
      }
      @if (successMessage()) {
        <p class="success">{{ successMessage() }}</p>
      }

      <button (click)="save()" [disabled]="isSaving() || !name().trim()" class="primary-button">
        {{ isSaving() ? 'Saving...' : 'Save changes' }}
      </button>
    </div>
  }
</div>
