<!-- libs/shared/src/lib/ui/toast/toast-container.component.html -->
<div class="toast-stack">
  @for (toast of toastService.toasts(); track toast.id) {
    <div class="toast" [attr.data-type]="toast.type">
      <span>{{ toast.message }}</span>
      <button (click)="toastService.dismiss(toast.id)" class="toast-close" aria-label="Dismiss">×</button>
    </div>
  }
</div>
