<div class="page">
  <div class="page-header">
    <h1 class="page-title">In-store purchases</h1>
  </div>

  <app-data-table
    [columns]="columns"
    [rows]="sales()"
    [totalCount]="totalCount()"
    [page]="page()"
    [pageSize]="pageSize()"
    [sortBy]="sortBy()"
    [sortDirection]="sortDirection()"
    [filters]="filters()"
    [loading]="isLoading()"
    emptyMessage="You don't have any in-store purchases yet."
    (queryChange)="onTableQuery($event)"
  />
</div>
