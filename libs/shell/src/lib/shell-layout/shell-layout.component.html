
<div class="shell">
  <!-- Fixed sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <app-brand-logo [size]="26" />
      <app-brand-wordmark />
    </div>

    <nav class="nav" aria-label="Main navigation">
      @for (item of visibleNavItems(); track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="nav-link-active"
          [routerLinkActiveOptions]="{ exact: item.path === '/dashboard' }"
          class="nav-link"
        >
          <app-icon [name]="item.icon" [size]="18" />
          <span class="nav-label">{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="user-panel">
      <a routerLink="/profile" class="profile-link">
        <app-avatar
          [avatarUrl]="currentUserStore.currentUser()?.avatarUrl ?? null"
          [size]="28"
        />

        <span class="user-details">
          <span class="user-name">
            {{ currentUserStore.currentUser()?.displayName || 'Staff account' }}
          </span>
          <span class="user-role">DoubleStar staff</span>
        </span>
      </a>

      <button
        type="button"
        (click)="logout()"
        class="logout-button"
      >
        <app-icon name="logout" [size]="16" />
        <span class="nav-label">Sign out</span>
      </button>
    </div>
  </aside>

  <!-- Main application column -->
  <div class="main-column">
    <header class="topbar">
      <div class="topbar-left">
        <button
          type="button"
          class="back-button"
          (click)="goBack()"
          aria-label="Go back to the previous page"
          title="Go back"
        >
          <app-icon name="arrow-left" [size]="18" />
          <span>Back</span>
        </button>

        <span class="topbar-divider" aria-hidden="true"></span>

        <span class="topbar-context">Staff Portal</span>
      </div>

      <div class="topbar-right">
        <span class="topbar-brand">DoubleStar</span>
      </div>
    </header>

    <main class="content">
      <div class="content-frame">
        <router-outlet />
      </div>
    </main>
  </div>
</div>
