<!-- libs/shell/src/lib/shell-layout/shell-layout.component.html — full replacement -->
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <app-brand-logo [size]="26" />
      <app-brand-wordmark />
    </div>

    <nav class="nav">
      @for (item of visibleNavItems(); track item.path) {
        <a [routerLink]="item.path" routerLinkActive="nav-link-active" class="nav-link">
          <app-icon [name]="item.icon" [size]="18" />
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="user-panel">
      <a routerLink="/profile" class="profile-link">
        <app-avatar [avatarUrl]="currentUserStore.currentUser()?.avatarUrl ?? null" [size]="20" />
        <p class="user-name">{{ currentUserStore.currentUser()?.displayName }}</p>
      </a>
      <button (click)="logout()" class="logout-button">
        <app-icon name="logout" [size]="14" />
        <span>Sign out</span>
      </button>
    </div>
  </aside>

  <main class="content">
    <router-outlet />
  </main>
</div>
