<div class="page">
  <div class="page-header">
    <div>
      <h1 class="page-title">
        Products
      </h1>

      <p class="page-description">
        Manage products, pricing, stock tracking and
        product status.
      </p>
    </div>

    <div class="header-actions">
      <a
        routerLink="/catalog/categories"
        class="secondary-button"
      >
        Categories
      </a>

      <a
        routerLink="/catalog/brands"
        class="secondary-button"
      >
        Brands
      </a>

      <a
        routerLink="/catalog/products/new"
        class="primary-button"
      >
        New product
      </a>
    </div>
  </div>

  <div class="toolbar">
    <button
      type="button"
      class="toggle-archived"
      (click)="toggleArchived()"
    >
      {{
        showArchived()
          ? 'Show active products'
          : 'Show archived products'
      }}
    </button>
  </div>
  <app-data-table
    [columns]="columns"
    [rows]="products()"
    [totalCount]="totalCount()"
    [page]="page()"
    [pageSize]="pageSize()"
    [sortBy]="sortBy()"
    [sortDirection]="sortDirection()"
    [filters]="filters()"
    [loading]="isLoading()"
    [rowLink]="rowLink"
    [rowActions]="rowActions"
    (queryChange)="handleQueryChange($event)"
  />
</div>
