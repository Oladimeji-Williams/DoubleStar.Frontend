<div class="page">
  <div class="page-header">
    <h1 class="page-title">
      Notification log
    </h1>
  </div>

  @if (errorMessage()) {
    <p class="error">
      {{ errorMessage() }}

      <button
        type="button"
        class="retry-link"
        (click)="retryLoad()">
        Try again
      </button>
    </p>
  }

  <app-data-table
    [columns]="columns"
    [rows]="entries()"
    [totalCount]="totalCount()"
    [page]="page()"
    [pageSize]="pageSize()"
    [sortBy]="sortBy()"
    [sortDirection]="sortDirection()"
    [filters]="filters()"
    [loading]="isLoading()"
    emptyMessage="No notifications found."
    (queryChange)="onTableQuery($event)" />
</div>
